# По образцу converter: GitHub Actions → Docker Hub → (опционально) деплой на VPS.
# Перед первым пушем задайте Secrets в GitHub → Settings → Secrets and variables → Actions.
name: Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: true
        type: string

env:
  # Поменяйте под свой Docker Hub namespace
  REGISTRY: liiiiiiiiis
  IMAGE_NAME: aegis-gate-landing
  # Раскомментируйте и заполните, когда будете деплоить по SSH как converter
  # DEPLOY_HOST: 0.0.0.0
  # DEPLOY_PATH: /opt/aegis-gate-landing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EVENT: ${{ github.event_name }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            push)
              echo "tags=${IMAGE}:latest,${IMAGE}:sha-${SHA::7}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "tags=${IMAGE}:${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=aegis-gate-landing
          cache-to: type=gha,mode=max,scope=aegis-gate-landing
