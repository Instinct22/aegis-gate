server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Актуальная версия приложения для кнопок «Скачать».
  # Тот же API, что у автообновления; через свой домен — чтобы не упираться в CORS.
  # Резолвим при запросе, чтобы nginx стартовал, даже если API недоступен.
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 5s;
  location = /api/app/latest {
    set $update_api https://api.aegis-gate.ru;
    proxy_pass $update_api;
    proxy_ssl_server_name on;
    proxy_set_header Host api.aegis-gate.ru;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Статика с версией в ссылке (?v=) — кэш надолго.
  location ~* \.(css|js|woff2|png|jpg|jpeg|webp|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    expires 7d;
  }

  # Страницы — всегда свежие. /connect и /faq тоже работают.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;

  # Не отдавать служебное
  location ~ /\. {
    deny all;
  }
}
