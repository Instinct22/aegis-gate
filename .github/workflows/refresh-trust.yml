name: Refresh VirusTotal reports

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vt-trust
  cancel-in-progress: false

env:
  REGISTRY: liiiiiiiiis
  IMAGE_NAME: aegis-gate-landing
  DEPLOY_HOST: 5.180.174.204
  DEPLOY_PATH: /opt/aegis-gate-landing

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update trust snapshot
        id: trust
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          python3 scripts/refresh-trust.py
          if git diff --quiet -- trust.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit snapshot
        if: steps.trust.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trust.json
          git commit -m "Update VirusTotal report snapshot. [skip ci]"
          git push

      - name: Set up Docker Buildx
        if: steps.trust.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.trust.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.trust.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=aegis-gate-landing
          cache-to: type=gha,mode=max,scope=aegis-gate-landing

      - name: Deploy snapshot
        if: steps.trust.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          command_timeout: 10m
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu
            cd ${{ env.DEPLOY_PATH }}
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              printf '%s\n' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            fi
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker compose ps
