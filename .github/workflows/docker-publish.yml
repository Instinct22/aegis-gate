name: Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: true
        type: string

env:
  REGISTRY: liiiiiiiiis
  IMAGE_NAME: aegis-gate-landing
  DEPLOY_HOST: 5.180.174.204
  DEPLOY_PATH: /opt/aegis-gate-landing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EVENT: ${{ github.event_name }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            push)
              echo "tags=${IMAGE}:latest,${IMAGE}:sha-${SHA::7}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "tags=${IMAGE}:${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=aegis-gate-landing
          cache-to: type=gha,mode=max,scope=aegis-gate-landing

  deploy:
    needs: build
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Docker on Debian
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          command_timeout: 20m
          script_stop: false
          script: |
            set -eu
            echo "=== Ensure Docker (Debian) ==="
            export DEBIAN_FRONTEND=noninteractive
            export DEBCONF_NONINTERACTIVE_SEEN=true
            export NEEDRESTART_MODE=a
            export NEEDRESTART_SUSPEND=1

            stub_grub_install() {
              if [ -e /usr/sbin/grub-install ] && [ ! -e /usr/sbin/grub-install.ci-bak ]; then
                cp -a /usr/sbin/grub-install /usr/sbin/grub-install.ci-bak
              fi
              printf '%s\n' '#!/bin/sh' 'exit 0' > /usr/sbin/grub-install
              chmod 755 /usr/sbin/grub-install
            }

            restore_grub_install() {
              if [ -e /usr/sbin/grub-install.ci-bak ]; then
                mv -f /usr/sbin/grub-install.ci-bak /usr/sbin/grub-install
              fi
              if [ -f /var/lib/dpkg/info/grub-pc.postinst.ci-bak ]; then
                mv -f /var/lib/dpkg/info/grub-pc.postinst.ci-bak /var/lib/dpkg/info/grub-pc.postinst
              fi
            }

            unstick_dpkg() {
              apt-mark hold grub-pc grub-efi-amd64 grub-efi-amd64-bin grub-efi-amd64-signed grub2-common grub-common os-prober >/dev/null 2>&1 || true
              echo 'grub-pc grub-pc/install_devices_empty boolean true' | debconf-set-selections >/dev/null 2>&1 || true
              echo 'grub-pc grub-pc/install_devices multiselect' | debconf-set-selections >/dev/null 2>&1 || true
              echo 'grub-pc grub-pc/install_devices_failed boolean true' | debconf-set-selections >/dev/null 2>&1 || true
              stub_grub_install
              if [ -f /var/lib/dpkg/info/grub-pc.postinst ]; then
                if [ ! -f /var/lib/dpkg/info/grub-pc.postinst.ci-bak ]; then
                  cp -a /var/lib/dpkg/info/grub-pc.postinst /var/lib/dpkg/info/grub-pc.postinst.ci-bak
                fi
                printf '%s\n' '#!/bin/sh' 'set -e' 'exit 0' > /var/lib/dpkg/info/grub-pc.postinst
                chmod 755 /var/lib/dpkg/info/grub-pc.postinst
              fi
              dpkg --configure -a >/dev/null 2>&1 || true
            }

            apt_ok() {
              unstick_dpkg
              apt-get install -y -qq --no-install-recommends "$@"
            }

            unstick_dpkg
            apt-get update -qq
            apt_ok ca-certificates curl
            for pkg in gnupg iptables nftables uidmap dbus kmod iproute2; do
              apt_ok "$pkg" || true
            done
            if ! command -v docker >/dev/null 2>&1; then
              unstick_dpkg
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sh /tmp/get-docker.sh || apt_ok docker.io
            fi
            if command -v systemctl >/dev/null 2>&1; then
              systemctl enable docker >/dev/null 2>&1 || true
              systemctl start docker >/dev/null 2>&1 || true
            fi
            if ! docker compose version >/dev/null 2>&1; then
              apt_ok docker-compose-plugin || apt_ok docker-compose-v2 || apt_ok docker-compose || true
            fi
            restore_grub_install
            if command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q 'Status: active'; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi
            docker --version
            docker compose version
            mkdir -p ${{ env.DEPLOY_PATH }} /opt/caddy-sites
            docker network inspect edge >/dev/null 2>&1 || docker network create edge

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}/

      - name: Sync Caddy site
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: aegis-gate.caddy
          target: /opt/caddy-sites/

      - name: Pull and recreate on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          LANDING_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          command_timeout: 10m
          script_stop: true
          envs: LANDING_IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu
            cd ${{ env.DEPLOY_PATH }}
            if [ ! -f docker-compose.yml ]; then
              echo "На сервере нет ${{ env.DEPLOY_PATH }}/docker-compose.yml" >&2
              exit 1
            fi
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              printf '%s\n' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            fi
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker compose ps
            if ! docker compose ps --status running | grep -q aegis-gate-landing; then
              docker compose logs --tail=120 landing || true
              exit 1
            fi
            caddy_name=$(docker ps --format '{{.Names}}' | grep caddy | head -n 1 || true)
            if [ -n "$caddy_name" ]; then
              mounts=$(docker inspect -f '{{range .Mounts}}{{.Destination}} {{end}}' "$caddy_name")
              case "$mounts" in
                *"/etc/caddy/sites"*)
                  docker exec "$caddy_name" caddy reload --config /etc/caddy/Caddyfile
                  ;;
              esac
            fi
